{% extends "base.html" %}
{% block title %}Recuperar contraseña{% endblock %}
{% block content %}
<div class="card auth-card">
  <a href="{{ url_for('login') }}" style="font-size:0.85rem;">&larr; Volver</a>
  <h1>Recuperar contraseña</h1>
  <p style="color:var(--muted); font-size:0.9rem;">
    Escribe el correo con el que te registraste. Te enviaremos un enlace para poner una contraseña nueva.
  </p>
  <form method="post">
    <label>Correo</label>
    <input type="email" name="email" required autofocus>
    <button type="submit">Enviar enlace</button>
  </form>
</div>
{% endblock %}
