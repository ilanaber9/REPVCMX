{% extends "base.html" %}
{% block title %}Nueva contraseña{% endblock %}
{% block content %}
<div class="card auth-card">
  <h1>Pon tu nueva contraseña</h1>
  <p style="color:var(--muted); font-size:0.9rem;">
    Escribe el código de 6 dígitos que te mandamos por WhatsApp junto con tu nueva contraseña.
  </p>
  <form method="post">
    <label>WhatsApp</label>
    <div style="display:flex; gap:8px; align-items:center;">
      <span style="padding:9px 10px; border:1px solid var(--border); border-radius:8px; color:var(--muted); background:#f5f5f5;">+52</span>
      <input type="tel" name="telefono" placeholder="55 1234 5678" maxlength="10" pattern="[0-9 ]*" required value="{{ telefono }}" style="flex:1;">
    </div>
    <label>Código</label>
    <input type="text" name="codigo" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="123456" required autofocus>
    <label>Contraseña nueva</label>
    <input type="password" name="password" minlength="8" required>
    <label>Repite la contraseña</label>
    <input type="password" name="password2" minlength="8" required>
    <button type="submit">Guardar contraseña</button>
  </form>
</div>
{% endblock %}
