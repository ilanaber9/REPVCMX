services:
  - type: web
    name: repvc-rutas-recoleccion
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --threads 4 --timeout 60
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: SMTP_EMAIL
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
